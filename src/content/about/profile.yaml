intro:
  ko:
    - 안녕하세요, 최선우입니다.
    - 제 궁극적인 목표는 사람들, 특히 학생들이 본격적으로 진로와 커리어를 고민하고 선택하는 과정에서, 진정으로 행복하게 살 수 있는 선택지를 찾고 그 길로 나아갈 수 있도록 돕는
      것입니다.
    - 이를 기술적으로 구현하기 위해 Recommender Systems, Reinforcement Learning, Interactive Machine Learning (IML) 등에
      관심을 갖고, 수학적인 배경을 바탕으로 공부하고 있습니다.
    - 그리고 2026년 2월 2일에 대한민국 육군에 입대하여 현재 군 복무 중이며, 자율 시간을 활용해 공부 및 개인 프로젝트를 진행하고 있습니다.
  en:
    - Hello, I’m Sunwoo Choi.
    - My ultimate goal is to help people, especially students, explore and pursue paths that can lead to
      genuinely happy lives as they begin making meaningful decisions about their futures and careers.
    - To put this goal into practice through technology, I am studying areas such as recommender systems,
      reinforcement learning, and interactive machine learning (IML), leveraging my background in
      mathematics.
    - I’ve been serving in the Republic of Korea Army since February 2, 2026. In my free time, I continue
      studying and working on personal projects.
