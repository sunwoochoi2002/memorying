intro:
  ko:
    - 안녕하세요, 최선우입니다.
    - 제 궁극적인 목표는 사람들, 특히 학생들이 본격적으로 진로와 커리어를 고민하고 선택하는 과정에서, 각자가 행복하게 살 수 있는 선택지를 찾고 그 길로 나아갈 수 있도록 돕는 것입니다.
    - 그리고, 이를 기술적으로 구현하기 위한 Recommender Systems, Reinforcement Learning, Interactive Machine Learning (IML) 등에 관심을 갖고 공부하고 있습니다.
    - 저는 2026년 2월 2일에 대한민국 육군에 입대하여 현재 군 복무 중이며, 자율 시간을 활용해 공부 및 개인 프로젝트를 진행하고 있습니다.
  en:
    - Hello, I’m Sunwoo Choi.
    - My long-term goal is to help people—especially students navigating important academic and career decisions—identify paths that align with what genuinely makes them happy and empower them to pursue those paths with confidence.
    - To explore how this can be achieved through technology, I am particularly interested in Recommender Systems, Reinforcement Learning, and Interactive Machine Learning (IML).
    - I am currently serving in the Republic of Korea Army, having enlisted on February 2, 2026. During my military service, I use my personal time to continue studying and working on independent projects.
