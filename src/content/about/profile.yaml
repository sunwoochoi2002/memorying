  - id: projects
    heading: Projects & Achievements
    entries:
      - title: JARVIS
        period: "2026.02"
        description:
          ko: 2025 UGRP Technology Entrepreneurship Track 장려상. 3인 팀의 팀장으로 로컬 파일을 인덱싱하고 RAG와 특화 Agent로 질의응답, 데이터 분석, 보고서
            생성, 맞춤 추천을 제공하는 데스크톱 AI 비서 시제품 JARVIS를 만들었습니다.
          en: Encouragement Prize, 2025 UGRP Technology Entrepreneurship Track. Led a three-person team to build JARVIS,
            a desktop AI assistant prototype that indexes local files and uses RAG and specialized agents to
            answer questions, analyze data, generate reports, and provide personalized recommendations.
      - title: BERA (Biotech Equity Risk Analytics)
        period: "2026.02"
        description:
          ko: 제1회 SL BIOFUTURE START-UP CHALLENGE 2025 대상. 팀과 함께 임상시험 결과를 예측하고 바이오 기업 데이터를 투자 위험 리포트로 만드는 AI 연구 플랫폼
            BERA를 개발했습니다. 수상을 계기로 샌프란시스코의 JPM Healthcare Week를 방문해 글로벌 바이오 투자 생태계를 살펴봤습니다.
          en: Grand Prize, 1st SL BIOFUTURE START-UP CHALLENGE 2025. Our team developed BERA, an AI research platform
            that predicts clinical trial outcomes and turns biotech company data into investment-risk reports.
            The award supported my visit to San Francisco during JPM Healthcare Week, where I explored the
            global biotech investment ecosystem.
      - title: START-UP 48
        period: "2025.07"
        description:
          ko: START-UP 48 대학 연합 창업 아이디어톤 1위. POSTECH, Seoul National University, KAIST, Yonsei University, Korea
            University 학생 48명이 참여하는 3일간의 행사입니다. 참가자는 팀을 이뤄 산업계 멘토의 지원을 받으며 아이디어 구상, 비즈니스 모델 개발, 시제품 제작, 최종
            발표까지 창업 과정을 경험합니다.
          en: 1st Prize, “START-UP 48” Inter-University Entrepreneurship Ideathon. START-UP 48 is a three-day
            inter-university ideathon bringing together 48 students from POSTECH, Seoul National University,
            KAIST, Yonsei University, and Korea University. Participants form teams and go through the full
            startup journey, from idea generation and business model development to prototyping and final
            pitching, supported by industry mentors.
      - title: Global Student Startup Competition (GSSC)
        period: "2025.05"
        description:
          ko: POSTECH 대표로 Human-Centered AI에 초점을 맞춘 글로벌 창업 프로그램에 참여했습니다. 한국의 주요 리더십 콘퍼런스에서 창업 역량을 키우고 국제 학생들과 인사이트를
            교류했습니다.
          en: POSTECH Representative, Global Student Startup Competition (GSSC), Asian Leadership Conference 2025.
            Participated in a global entrepreneurship program focused on Human-Centered AI. Built
            entrepreneurial competencies and exchanged insights with international students at Korea's premier
            leadership conference.
      - title: Techathon
        period: "2025.01"
        description:
          ko: Techathon 3위. Technology와 Ideathon을 합친 이름으로, 기술을 바탕으로 창업 아이디어를 만들고 비즈니스 모델로 구체화하는 행사입니다.
          en: 3rd Prize, “Techathon”. Techathon is a combination of “Technology” and “Ideathon,” a startup event where
            participants develop startup ideas based on technology and refine them into business models.
      - title: Crackathon
        period: "2024.11"
        description:
          ko: Crackathon 3위. cracking과 ideathon을 합친 이름으로, 대기업의 관습적인 틀에서 벗어나는 혁신적인 아이디어를 제안하는 행사입니다.
          en: 3rd Prize, “Crackathon”. Crackathon is a combination of “cracking” and “ideathon,” where participants
            present innovative ideas to break away from the conventional frameworks of large corporations.
      - title: POSTECH Mathematics Research Paper Award
        period: "2024.11"
        description:
          ko: "2024 POSTECH Mathematics Research Paper Award 대상. 논문: “Statistical Estimation of Prime Divisor CDF for
            Finite N in Erdős-Kac Theorem.”"
          en: "Grand Prize, 2024 POSTECH Mathematics Research Paper Award. Paper: “Statistical Estimation of Prime
            Divisor CDF for Finite N in Erdős-Kac Theorem.”"
      - title: Introducing My Research in 2023
        period: "2023.11"
        description:
          ko: "Introducing My Research in 2023 최종 후보(장려상). 발표 주제: “Markov chain and its applications.”"
          en: "Finalist (Encouragement Prize), “Introducing My Research in 2023”. Topic: “Markov chain and its
            applications.”"
        link:
