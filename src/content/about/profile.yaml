          ko: Tech-Review는 POSTECH 창업 부서의 지원을 받는 조직입니다. 최신 기술 동향을 대학 구성원과 공유하고, 창업 문화를 조성하며, 기술의 가치를 알리는 것을 목표로 합니다.
          en: Tech-Review is an organization supported by POSTECH's Startup Department. It aims to share the latest
            technological trends with university members, foster an entrepreneurial culture, and highlight the
            value of technology.
