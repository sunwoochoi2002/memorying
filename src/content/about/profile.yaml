      - title: Korean Business Networking Conference (KBNC) 2025
        period: "2025.06"
        description:
          ko: Korean Business Networking Conference (KBNC)는 비즈니스와 혁신에 열정을 가진 학생들을 연결하고 네트워크를 확장하는 행사입니다. KBO가 주최하며 글로벌
            대학 학생들이 전문가 워크숍과 패널, 심층 커리어 토론, 의미 있는 네트워킹에 참여합니다.
          en: The Korean Business Networking Conference (KBNC) aims to connect students passionate about business and
            innovation while expanding this network further. Hosted by KBO, KBNC brings together global
            universities for workshops and panels led by industry experts, in-depth career development
            discussions, and meaningful networking opportunities.
      - title: Tech-Review @ POSTECH
        period: "2025.01"
