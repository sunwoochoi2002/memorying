intro:
  ko:
    - 안녕하세요, 최선우입니다.
    - 저의 목표는 사람들, 특히 학생들이 진로와 커리어를 선택할 때 진정으로 행복하게 살 수 있는 길을 찾도록 돕는 것입니다. 이를 기술로 구현하기 위해 추천 시스템, 강화학습,
      Interactive ML (IML)을 수학적 배경을 바탕으로 공부하고 있습니다.
  en:
    - Hello, I’m Sunwoo Choi.
    - My goal is to help people, especially students, find career paths that allow them to live genuinely
      happy lives. To work toward this through technology, I study recommender systems, reinforcement
      learning, and Interactive ML (IML), drawing on my mathematical background.
