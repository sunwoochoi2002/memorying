id: activities
heading: Activities & Leadership
order: 3
entries:
  - title: Military Service @ Republic of Korea Army (ROKA)
    period: 2026.02–Present
    description:
      ko: 2026년 2월부터 대한민국 육군에서 복무하고 있습니다. 개인정비시간에는 공부와 개인 프로젝트를 이어가고 있습니다.
      en: I have been serving in the Republic of Korea Army since February 2026. During off-duty hours, I
        continue to study and work on personal projects.
  - title: CES 2026
    period: "2026.01"
    description:
      ko: 미국 Las Vegas에서 열린 CES 2026에 참석했습니다.
      en: I attended CES 2026 in Las Vegas, USA.
  - title: Korean Business Networking Conference (KBNC) 2025
    period: "2025.06"
    description:
      ko: Korean Business Networking Conference (KBNC)는 비즈니스와 혁신에 열정을 가진 학생들을 연결하고 네트워크를 확장하는 행사입니다. KBO가 주최하며
        글로벌 대학 학생들이 전문가 워크숍과 패널, 심층 커리어 토론, 의미 있는 네트워킹에 참여합니다.
      en: The Korean Business Networking Conference (KBNC) aims to connect students passionate about business
        and innovation while expanding this network further. Hosted by KBO, KBNC brings together global
        universities for workshops and panels led by industry experts, in-depth career development
        discussions, and meaningful networking opportunities.
  - title: POSTECH Representative, Global Student Startup Competition (GSSC) / Asian Leadership Conference 2025
    period: "2025.05"
    description:
      ko: POSTECH 대표로 Human-Centered AI에 초점을 맞춘 글로벌 창업 프로그램에 참여했습니다. 한국의 주요 리더십 콘퍼런스에서 창업 역량을 키우고 국제 학생들과 인사이트를
        교류했습니다.
      en: Participated in a global entrepreneurship program focused on Human-Centered AI. Built entrepreneurial
        competencies and exchanged insights with international students at Korea's premier leadership
        conference.
  - title: Tech-Review @ POSTECH
    period: "2025.01"
    description:
      ko: Tech-Review는 POSTECH 창업 부서의 지원을 받는 조직입니다. 최신 기술 동향을 대학 구성원과 공유하고, 창업 문화를 조성하며, 기술의 가치를 알리는 것을 목표로
        합니다.
      en: Tech-Review is an organization supported by POSTECH's Startup Department. It aims to share the latest
        technological trends with university members, foster an entrepreneurial culture, and highlight
        the value of technology.
  - title: CES 2024
    period: "2024.01"
    description:
      ko: 미국 Las Vegas에서 열린 CES 2024에 참석했습니다.
      en: CES 2024, attendee, Las Vegas, USA.
