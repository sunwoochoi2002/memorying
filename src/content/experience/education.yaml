entries:
  - title: Mathematics @ POSTECH
    period: 2021.02–Present
    description:
      ko: "POSTECH에서 수학을 전공하고 Industrial & Management Engineering과 Entrepreneurship를 부전공하며 재학 중입니다. 수학 전공 수업:
        Calculus I/II; Freshman Research Participation; Differential Equations; Applied Linear Algebra;
        Probability and Statistics; Modern Algebra I/II; Analysis I/II; Introduction to Numerical
        Analysis; Introduction to Probability Theory; Introduction to Mathematical Data Science;
        Independent Study A; Mathematics for AI. Industrial & Management Engineering 부전공 수업: R
        programming for data analysis; Investment Theory; Introduction to Financial Engineering;
        Introduction to Experimental Design; Mathematical Programming. Entrepreneurship 부전공 수업:
        Entrepreneurship; Principles of Business Administration; Entrepreneurship Seminar; Action
        Learning in Business Planning. Computer Science & Engineering 수업: Programming and Problem
        Solving; Introduction to Date Analysis; Object Oriented Programming; Data Structure."
      en: "Mathematics student at POSTECH, minoring in Industrial & Management Engineering and
        Entrepreneurship. Mathematics coursework: Calculus I/II; Freshman Research Participation;
        Differential Equations; Applied Linear Algebra; Probability and Statistics; Modern Algebra I/II;
        Analysis I/II; Introduction to Numerical Analysis; Introduction to Probability Theory;
        Introduction to Mathematical Data Science; Independent Study A; Mathematics for AI. Industrial &
        Management Engineering coursework: R programming for data analysis; Investment Theory;
        Introduction to Financial Engineering; Introduction to Experimental Design; Mathematical
        Programming. Entrepreneurship coursework: Entrepreneurship; Principles of Business
        Administration; Entrepreneurship Seminar; Action Learning in Business Planning. Department of
        Computer Science & Engineering coursework: Programming and Problem Solving; Introduction to Date
        Analysis; Object Oriented Programming; Data Structure."
